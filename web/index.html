<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>HappyMpX</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f6f7f9; color: #1f2430;
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif; padding: 20px; }
  .card { max-width: 460px; background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 32px 28px; text-align: center; }
  .icon { width: 44px; height: 44px; border-radius: 10px; background: #ee1e58; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 24px; }
  h1 { font-size: 22px; margin: 14px 0 10px; }
  p { color: #6b7280; line-height: 1.7; margin: 8px 0; font-size: 15px; }
  a.btn { display: inline-block; margin-top: 18px; background: #ee1e58; color: #fff; text-decoration: none; font-weight: 700; padding: 12px 24px; border-radius: 999px; }
</style>
</head>
<body>
  <main class="card">
    <div class="icon">♪</div>
    <h1>웹 변환은 운영하지 않아요</h1>
    <p>유튜브가 웹서버 주소를 막아서, 이 주소에서는 MP3·MP4 변환을 할 수 없어요.</p>
    <p>컴퓨터에 풀어서 쓰는 프로그램 <b>HappyMpX</b>를 쓰세요. 허브에서 비밀번호를 입력하면 받을 수 있어요.</p>
    <a class="btn" href="https://penedu.web.app/">교육자료 허브로 가기</a>
  </main>
</body>
</html>
