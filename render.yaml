# Render(render.com) Blueprint. 이 저장소 맨 위에 있어야 읽힌다.
# ACCESS_CODE(입장 비밀번호)는 값을 여기에 적지 않는다. Render 화면에서 직접 넣는다.
services:
  - type: web
    name: happympx
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ACCESS_CODE
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://happymp3.web.app
      - key: MAX_SECONDS
        value: "1800"
      - key: MAX_HEIGHT
        value: "720"
      - key: DIAG_ENABLED
        value: "1"   # 유튜브 접속 방식 진단(/diag). 확인이 끝나면 이 두 줄을 지운다
